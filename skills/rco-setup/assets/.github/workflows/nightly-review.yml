# Nightly Review Workflow Template
#
# Adapt before use:
#   1. Replace <PROVIDER>_API_KEY with your chosen provider (ANTHROPIC_API_KEY, OPENAI_API_KEY, etc.)
#   2. Adjust skill paths to match your project layout
#   3. Adjust pi flags (model, thinking level, etc.) to your preference
#   4. Remove or add review steps as needed
#
# Required secrets:
#   - API key for your chosen LLM provider

name: Nightly Review

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC every day
  workflow_dispatch:       # manual trigger

jobs:
  nightly-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install mise and tools
        uses: jdx/mise-action@v4
        with:
          install: true
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run drift inspection
        env:
          # Replace with your provider's API key secret name
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Adjust --model, --thinking, --skill path as needed
          pi -p --no-extensions \
            --skill skills/rco-nightly-inspect/SKILL.md \
            "Run the nightly drift inspection for this repository."

      - name: Run spaghetti code review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pi -p --no-extensions \
            --skill skills/rco-review-spaghetti/SKILL.md \
            "Run a full repository spaghetti code review. Trigger mode: nightly scan."

      - name: Run toil review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          pi -p --no-extensions \
            --skill skills/rco-review-toil/SKILL.md \
            "Run a full repository toil review. Trigger mode: nightly scan."
